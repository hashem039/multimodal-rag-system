[project]
name = "multi-modal-rag-pipeline"
version = "0.1.0"
description = "A unified pipeline for Audio, Image, and Video RAG"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "llama-index",
    "pinecone-client",
    "python-dotenv",
    "ruff",
    "sentence-transformers",
    "torch",
    "faster-whisper",
    "streamlit"
]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = []
